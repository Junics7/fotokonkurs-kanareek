<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модерация — Фотоконкурс канареек</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><div id="loginView" class="login"><div class="login-card"><div class="admin-logo">🐤</div><span class="eyebrow">Закрытый раздел</span><h1>Панель модерации</h1><p>Войдите с паролем администратора, чтобы проверять заявки участников.</p><form id="loginForm"><label>Пароль администратора<input id="adminPassword" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Войти</button><div id="loginNote" class="note"></div></form><a href="index.html" class="back-link">← Вернуться на сайт</a></div></div><div id="appView" class="hidden"><header class="admin-header"><div><a href="index.html" class="brand">🐤 <span>Фотоконкурс <strong>канареек</strong></span></a><span class="admin-title">Модерация</span></div><div class="header-actions"><button id="changePasswordBtn" class="ghost">Сменить пароль</button><button id="logoutBtn" class="ghost">Выйти</button></div></header><main class="admin-main"><div class="topbar"><div><span class="eyebrow">Управление конкурсом</span><h1>Заявки участников</h1></div><button id="refreshBtn" class="button secondary">↻ Обновить</button></div><div class="stats"><div><strong id="allCount">0</strong><span>Всего</span></div><div><strong id="pendingCount">0</strong><span>На модерации</span></div><div><strong id="approvedCount">0</strong><span>Одобрено</span></div><div><strong id="rejectedCount">0</strong><span>Отклонено</span></div></div><div class="tabs"><button class="active" data-status="all">Все</button><button data-status="pending">На модерации</button><button data-status="approved">Одобрено</button><button data-status="rejected">Отклонено</button></div><section class="content-grid"><div id="list" class="requests"></div><aside id="detail" class="detail"><div class="detail-empty">Выберите заявку слева</div></aside></section></main></div><div id="passwordModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><h2>Смена пароля</h2><form id="passwordForm"><label>Текущий пароль<input id="currentPassword" type="password" required></label><label>Новый пароль<input id="newPassword" type="password" minlength="12" required><small>Не менее 12 символов.</small></label><button class="button" type="submit">Сохранить новый пароль</button><div id="passwordNote" class="note"></div></form></div></div><script type="module" src="admin.js"></script></body></html>
